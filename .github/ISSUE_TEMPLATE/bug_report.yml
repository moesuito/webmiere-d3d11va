```yaml
name: Bug report
description: Report a reproducible bug in a supported file and environment
title: "[Bug] "

body:
  - type: markdown
    attributes:
      value: |
        Source files under `src/` are free and open-source software licensed under the Mozilla Public License 2.0 (MPL-2.0), without individual support.

        GitHub Issues are only for reproducible bugs involving supported files and environments.

        Before opening an issue:

        1. Read the README.
        2. Check the affected file with the WebMiere Checker:
           https://kawaiiengine.github.io/WebMiere/checker/
        3. Search existing Issues.
        4. For questions or general troubleshooting, search the web or ask an AI assistant.

        Only files for which the checker reports `Should work, I guess.` are accepted for bug reports.

        The following are not accepted:

        - Usage questions
        - Installation or environment setup help
        - Feature requests
        - Requests to support additional formats, platforms, GPUs, or Premiere Pro versions
        - General troubleshooting without reproducible information

        Incomplete or unsupported reports may be closed without a reply.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have read the README and confirmed that my file and environment are supported.
          required: true
        - label: I reproduced the problem using the latest release of WebMiere.
          required: true
        - label: I searched the existing issues for the same problem.
          required: true
        - label: This is a reproducible bug report, not a question or feature request.
          required: true
        - label: I understand that there is no guarantee that this issue will be investigated, receive a reply, or be fixed.
          required: true

  - type: dropdown
    id: checker-verdict
    attributes:
      label: WebMiere Checker result
      description: Run the exact affected file through the WebMiere Checker before submitting.
      options:
        - Should work, I guess.
    validations:
      required: true

  - type: input
    id: webmiere-version
    attributes:
      label: WebMiere version
      description: Enter the exact version number. Do not write only "latest."
      placeholder: "v1.2.1"
    validations:
      required: true

  - type: input
    id: premiere-version
    attributes:
      label: Adobe Premiere Pro version
      description: Enter the complete version number shown in About Premiere Pro.
      placeholder: "26.x.x"
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: NVIDIA GPU
      description: Enter the complete GPU model name.
      placeholder: "GeForce RTX 5090"
    validations:
      required: true

  - type: input
    id: driver-version
    attributes:
      label: NVIDIA driver version
      description: Enter the installed NVIDIA graphics driver version.
      placeholder: "610.62"
    validations:
      required: true

  - type: textarea
    id: media-info
    attributes:
      label: MPC-BE MediaInfo
      description: |
        Open the affected file in MPC-BE → File → Properties → MediaInfo.
        Paste everything from "Format / 形式" onward without editing.
        Screenshots are not accepted.
      render: text
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: Provide the exact sequence of operations required to reproduce the problem.
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Describe exactly what happened.
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      options:
        - Every time
        - Sometimes
    validations:
      required: true

  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Add any other information directly relevant to reproducing the bug.
```
